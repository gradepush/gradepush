name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
        env:
          POSTGRES_DB: gradepush_test
          POSTGRES_USER: gradepush
          POSTGRES_PASSWORD: gradepush
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gradepush -d gradepush_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: gradepush
      DB_PASSWORD: gradepush

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Elixir and Erlang
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: 1.20.4
          otp-version: 29.1.1
          version-type: strict

      - name: Fetch locked dependencies
        run: mix deps.get --check-locked

      - name: Check translation catalogs
        run: mix gettext.extract --check-up-to-date

      - name: Check native endpoint server defaults
        run: mix run --no-start -e 'Application.put_env(:phoenix, :serve_endpoints, true); true = Phoenix.Endpoint.Supervisor.server?(:gradepush, GradePushWeb.Endpoint)'

      - name: Run project checks
        run: mix precommit

      - name: Check release secret initialization
        run: scripts/test-release-env

      - name: Build production assets
        run: MIX_ENV=prod mix assets.deploy

      - name: Build release
        run: MIX_ENV=prod mix release

      - name: Smoke-test the Compose release
        run: |
          scripts/local-compose up --build -d --wait --wait-timeout 120
          docker compose exec -T app test -s /app/LICENSE
          docker compose exec -T app test -s /app/THIRD_PARTY_NOTICES.md
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT rolsuper FROM pg_roles WHERE rolname = current_user"')" = f
          python3 - <<'PY'
          from html.parser import HTMLParser
          import json
          import ssl
          from urllib.parse import urljoin, urlparse
          from urllib.request import urlopen

          base_url = "https://localhost:4000"
          context = ssl.create_default_context(cafile="priv/cert/ca.pem")

          with urlopen(f"{base_url}/health/ready", context=context, timeout=10) as response:
              if json.load(response) != {"status": "ok"}:
                  raise SystemExit("The health endpoint did not return the expected status.")

          class LocalAssets(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = set()

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  value = attrs.get("href") if tag == "link" else attrs.get("src") if tag == "script" else None
                  if value:
                      url = urljoin(base_url, value)
                      if urlparse(url).netloc == urlparse(base_url).netloc:
                          self.urls.add(url)

          with urlopen(base_url, context=context, timeout=10) as response:
              html = response.read().decode("utf-8")
          assets = LocalAssets()
          assets.feed(html)
          if not assets.urls:
              raise SystemExit("No local stylesheet, script, or icon links were found.")
          for url in sorted(assets.urls):
              with urlopen(url, context=context, timeout=10) as response:
                  if response.status != 200:
                      raise SystemExit(f"Unexpected HTTP {response.status} for {url}")
          print(f"Fetched the homepage and {len(assets.urls)} local assets.")
          PY

      - name: Collect Compose logs after failure
        if: failure()
        run: docker compose logs --no-color || true

      - name: Scan runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: gradepush:local
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Remove Compose smoke-test services
        if: always()
        run: docker compose -f compose.yaml -f compose.local.yaml down --volumes --remove-orphans
