name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '17 7 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-security:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the pinned database image
        id: database
        run: |
          image=$(python3 -c 'import json; print(json.load(open("security/postgres-exceptions.json"))["image"])')
          grep -F "image: $image" compose.self-host.yaml
          echo "image=$image" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/security-reports"

      - name: Scan every database image component
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ steps.database.outputs.image }}
          scanners: vuln
          format: json
          output: ${{ runner.temp }}/security-reports/postgres.json
          exit-code: '0'

      - name: Check gosu symbols and reviewed database findings
        env:
          DATABASE_IMAGE: ${{ steps.database.outputs.image }}
        run: |
          scratch=$(mktemp -d)
          container=$(docker create "$DATABASE_IMAGE")
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true; rm -rf "$scratch"' EXIT
          docker cp "$container:/usr/local/bin/gosu" "$scratch/gosu"
          docker run --rm -e GOTOOLCHAIN=local -v "$scratch:/scan:ro" \
            golang:1.27.1-alpine3.24@sha256:8a5910f31396cd4d89662f56c68b3ae31d374308270a1c3bd96672ee5ed43414 \
            go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -mode=binary /scan/gosu \
            > "$RUNNER_TEMP/security-reports/gosu-symbols.log" 2>&1
          python3 scripts/test-image-scan
          python3 scripts/check-image-scan "$RUNNER_TEMP/security-reports/postgres.json" \
            --exceptions security/postgres-exceptions.json --gosu-symbols-checked

      - name: Retain the full database security report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-security
          path: ${{ runner.temp }}/security-reports/
          retention-days: 30

  development:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: v5.5.1

      - name: Start development with Docker only
        run: docker compose -p gradepush-development -f compose.development.yaml up -d --build --wait --wait-timeout 600

      - name: Check development HTTPS and file synchronization
        run: |
          docker compose -p gradepush-development -f compose.development.yaml cp app:/certs/ca.pem /tmp/gradepush-ca.pem
          curl --fail --silent --cacert /tmp/gradepush-ca.pem https://localhost:4000/setup > /dev/null
          docker compose -p gradepush-development -f compose.development.yaml watch --no-up > /tmp/gradepush-watch.log 2>&1 &
          watch_pid=$!
          trap 'kill "$watch_pid" 2>/dev/null || true' EXIT
          sleep 5
          printf '<svg xmlns="http://www.w3.org/2000/svg"><title>watch-check</title></svg>\n' > priv/static/images/watch-check.svg
          for _attempt in $(seq 1 20); do
            if curl --fail --silent --cacert /tmp/gradepush-ca.pem https://localhost:4000/images/watch-check.svg | grep -q watch-check; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/gradepush-watch.log
          exit 1

      - name: Collect development logs after failure
        if: failure()
        run: docker compose -p gradepush-development -f compose.development.yaml logs --no-color --tail 100

      - name: Stop development services
        if: always()
        run: docker compose -p gradepush-development -f compose.development.yaml down --volumes --remove-orphans

  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
        env:
          POSTGRES_DB: gradepush_test
          POSTGRES_USER: gradepush
          POSTGRES_PASSWORD: gradepush
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gradepush -d gradepush_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: gradepush
      DB_PASSWORD: gradepush

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: v5.5.1

      - name: Set up Elixir and Erlang
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: 1.20.4
          otp-version: 29.1.1
          version-type: strict

      - name: Fetch locked dependencies
        run: mix deps.get --check-locked

      - name: Audit Hex dependencies
        run: mix hex.audit

      - name: Report available dependency updates
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: mix hex.outdated --all

      - name: Check translation catalogs
        run: mix gettext.extract --check-up-to-date

      - name: Check native endpoint server defaults
        run: mix run --no-start -e 'Application.put_env(:phoenix, :serve_endpoints, true); true = Phoenix.Endpoint.Supervisor.server?(:gradepush, GradePushWeb.Endpoint)'

      - name: Run project checks
        run: mix precommit

      - name: Check release secret initialization
        run: scripts/test-release-env

      - name: Check installation assistant
        run: python3 scripts/test-install

      - name: Check Docker build context exclusions
        run: scripts/test-docker-context

      - name: Check standalone installation configuration
        env:
          PHX_HOST: grades.example.org
          DB_PASSWORD: compose-validation-only
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          config = json.loads(subprocess.check_output([
              "docker", "compose", "-f", "compose.self-host.yaml", "config", "--format", "json"
          ]))
          assert config["networks"]["database"]["internal"] is True
          database = config["services"]["db"]
          assert set(database["networks"]) == {"database"}
          assert set(database["cap_add"]) == {"CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"}
          assert config["services"]["app"]["environment"]["TRUSTED_PROXY_HOSTS"] == "caddy"
          for service in ("app", "db", "caddy"):
              settings = config["services"][service]
              assert settings["read_only"] and settings["mem_limit"] and settings["pids_limit"]
              assert settings["cap_drop"] == ["ALL"]
              assert "no-new-privileges:true" in settings["security_opt"]
          for name, source in [("GRADEPUSH_POSTGRES_INIT", "deploy/postgres-init.sh"), ("GRADEPUSH_CADDYFILE", "deploy/Caddyfile")]:
              actual = config["services"]["runtime-config-init"]["environment"][name].replace("$$", "$")
              assert actual == Path(source).read_text().expandtabs(4), f"{name} differs from {source}"
          for name, service in config["services"].items():
              assert "build" not in service, f"{name} requires a source build"
              assert all(volume["type"] == "volume" for volume in service.get("volumes", [])), f"{name} needs local files"
              if name != "caddy":
                  assert not service.get("ports"), f"{name} exposes a port"
          PY

      - name: Build production assets
        run: MIX_ENV=prod mix assets.deploy

      - name: Build release
        run: MIX_ENV=prod mix release

      - name: Smoke-test the Compose release
        run: |
          docker compose -f compose.yaml up --build -d --wait --wait-timeout 120
          mkdir -p priv/cert
          docker compose -f compose.yaml cp app:/app/local-certs/ca.pem priv/cert/ca.pem
          docker compose -f compose.yaml run --rm -T --no-deps --entrypoint sh local-https < scripts/test-local-https
          docker compose exec -T app test -s /app/LICENSE
          docker compose exec -T app test -s /app/THIRD_PARTY_NOTICES.md
          test "$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT rolsuper FROM pg_roles WHERE rolname = current_user"')" = f
          python3 - <<'PY'
          from html.parser import HTMLParser
          import json
          import ssl
          from urllib.parse import urljoin, urlparse
          from urllib.request import urlopen

          base_url = "https://localhost:4000"
          context = ssl.create_default_context(cafile="priv/cert/ca.pem")

          with urlopen(f"{base_url}/health/ready", context=context, timeout=10) as response:
              if json.load(response) != {"status": "ok"}:
                  raise SystemExit("The health endpoint did not return the expected status.")

          class LocalAssets(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = set()

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  value = attrs.get("href") if tag == "link" else attrs.get("src") if tag == "script" else None
                  if value:
                      url = urljoin(base_url, value)
                      if urlparse(url).netloc == urlparse(base_url).netloc:
                          self.urls.add(url)

          with urlopen(base_url, context=context, timeout=10) as response:
              html = response.read().decode("utf-8")
          assets = LocalAssets()
          assets.feed(html)
          if not assets.urls:
              raise SystemExit("No local stylesheet, script, or icon links were found.")
          for url in sorted(assets.urls):
              with urlopen(url, context=context, timeout=10) as response:
                  if response.status != 200:
                      raise SystemExit(f"Unexpected HTTP {response.status} for {url}")
          print(f"Fetched the homepage and {len(assets.urls)} local assets.")
          PY

      - name: Collect Compose logs after failure
        if: failure()
        run: docker compose logs --no-color || true

      - name: Check trusted local HTTPS on Linux
        run: |
          scripts/setup-https
          docker compose -f compose.yaml -f compose.trusted.yaml up -d --wait --wait-timeout 120
          curl --fail --silent https://localhost:4000/health/ready

      - name: Set up browser test runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
          cache: npm
          cache-dependency-path: test/browser/package-lock.json

      - name: Check browser security and GitHub setup form
        run: |
          npm ci --ignore-scripts --prefix test/browser
          npm audit --prefix test/browser
          PHX_HOST=grades.example HOST_PORT=4002 GRADEPUSH_IMAGE=gradepush:local \
            docker compose -p gradepush-browser-setup -f compose.yaml up -d --build --wait --wait-timeout 120
          cd test/browser
          npx playwright install --with-deps chromium
          setup_link=$(docker compose -p gradepush-browser-setup -f ../../compose.yaml exec -T app gradepush-setup)
          export GRADEPUSH_TEST_SETUP_TOKEN=${setup_link##*setup_token=}
          echo "::add-mask::$GRADEPUSH_TEST_SETUP_TOKEN"
          GRADEPUSH_TEST_URL=https://grades.example:4002 npm test

      - name: Check teacher and student browser security
        run: |
          HOST_PORT=4001 GRADEPUSH_IMAGE=gradepush:local DEMO_MODE=true \
            docker compose -p gradepush-browser-demo -f compose.yaml up -d --build --wait --wait-timeout 120
          GRADEPUSH_TEST_MODE=demo GRADEPUSH_TEST_URL=https://localhost:4001 npm test --prefix test/browser

      - name: Scan runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: gradepush:local
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Build TLS proxy image
        run: docker build -f deploy/caddy/Dockerfile -t gradepush-caddy:local .

      - name: Check reachable TLS proxy vulnerabilities
        run: |
          docker run --rm -e GOTOOLCHAIN=local -v "$PWD/deploy/caddy:/source:ro" -w /source \
            golang:1.27.1-alpine3.24@sha256:8a5910f31396cd4d89662f56c68b3ae31d374308270a1c3bd96672ee5ed43414 \
            go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Scan TLS proxy image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: gradepush-caddy:local
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Remove Compose smoke-test services
        if: always()
        run: |
          docker compose -f compose.yaml down --volumes --remove-orphans
          HOST_PORT=4001 GRADEPUSH_IMAGE=gradepush:local DEMO_MODE=true \
            docker compose -p gradepush-browser-demo -f compose.yaml down --volumes --remove-orphans
          PHX_HOST=grades.example HOST_PORT=4002 GRADEPUSH_IMAGE=gradepush:local \
            docker compose -p gradepush-browser-setup -f compose.yaml down --volumes --remove-orphans
