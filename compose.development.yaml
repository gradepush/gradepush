services:
  local-https:
    extends:
      file: compose.yaml
      service: local-https

  app:
    build:
      context: .
      target: development
    init: true
    depends_on:
      local-https:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: gradepush
      DB_PASSWORD: gradepush
      DB_NAME: gradepush_dev
      DEMO_MODE: ${DEMO_MODE:-false}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      PHX_BIND_IP: 0.0.0.0
      PORT: ${DEV_PORT:-4000}
      TLS_CERTFILE: /certs/localhost.pem
      TLS_KEYFILE: /certs/localhost-key.pem
    ports:
      - "127.0.0.1:${DEV_PORT:-4000}:${DEV_PORT:-4000}"
    volumes:
      - dev_deps:/app/deps
      - dev_build:/app/_build
      - local_certs:/certs:ro
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          initial_sync: true
          ignore:
            - config/
            - mix.exs
            - mix.lock
        - action: sync+restart
          path: config
          target: /app/config
        - action: rebuild
          path: mix.exs
        - action: rebuild
          path: mix.lock
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --cacert /certs/ca.pem https://localhost:$$PORT/health/ready >/dev/null"]
      interval: 5s
      timeout: 5s
      start_period: 600s
      retries: 12

  db:
    extends:
      file: compose.yaml
      service: db
    environment:
      POSTGRES_DB: gradepush_dev
      POSTGRES_USER: gradepush
      POSTGRES_PASSWORD: gradepush
      POSTGRES_APP_CREATEDB: "true"
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-54329}:5432"

volumes:
  dev_deps:
  dev_build:
  postgres_data:
  local_certs:
