x-caddyfile: &caddyfile |
  {
      admin off
      http_port 8080
      https_port 8443
  }

  {$$PHX_HOST} {
      reverse_proxy app:4000
  }

x-postgres-init: &postgres-init |
  #!/bin/sh
  set -eu

  case "$$POSTGRES_USER" in
    gradepush_operator|gradepush_initializer)
      echo "DB_USER cannot use a reserved GradePush operator role." >&2
      exit 1
      ;;
  esac

  psql --no-psqlrc --set=ON_ERROR_STOP=1 \
    --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" <<'SQL'
  CREATE ROLE gradepush_initializer WITH LOGIN SUPERUSER PASSWORD NULL;
  SQL

  # PostgreSQL's bootstrap role must remain a superuser; retain it for local administration.
  psql --no-psqlrc --set=ON_ERROR_STOP=1 \
    --username gradepush_initializer --dbname "$$POSTGRES_DB" \
    --set=app_user="$$POSTGRES_USER" --set=app_database="$$POSTGRES_DB" \
    --set=can_create_db="$${POSTGRES_APP_CREATEDB:-false}" <<'SQL'
  \getenv app_password POSTGRES_PASSWORD
  ALTER ROLE :"app_user" RENAME TO gradepush_operator;
  ALTER ROLE gradepush_operator PASSWORD NULL;
  CREATE ROLE :"app_user" WITH LOGIN PASSWORD :'app_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
  ALTER DATABASE :"app_database" OWNER TO :"app_user";
  \if :can_create_db
  ALTER ROLE :"app_user" CREATEDB;
  \endif
  SQL

  psql --no-psqlrc --set=ON_ERROR_STOP=1 \
    --username gradepush_operator --dbname "$$POSTGRES_DB" <<'SQL'
  DROP ROLE gradepush_initializer;
  SQL

services:
  runtime-config-init:
    image: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    network_mode: none
    read_only: true
    user: "0:0"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 64m
    pids_limit: 16
    environment:
      GRADEPUSH_POSTGRES_INIT: *postgres-init
      GRADEPUSH_CADDYFILE: *caddyfile
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        printf '%s' "$$GRADEPUSH_POSTGRES_INIT" > /postgres-init/10-gradepush.sh.tmp
        chmod 0444 /postgres-init/10-gradepush.sh.tmp
        mv /postgres-init/10-gradepush.sh.tmp /postgres-init/10-gradepush.sh
        printf '%s' "$$GRADEPUSH_CADDYFILE" > /caddy-config/Caddyfile.tmp
        chmod 0444 /caddy-config/Caddyfile.tmp
        mv /caddy-config/Caddyfile.tmp /caddy-config/Caddyfile
    volumes:
      - postgres_init:/postgres-init
      - caddy_runtime_config:/caddy-config

  app:
    image: ${GRADEPUSH_IMAGE:-ghcr.io/gradepush/gradepush:0.1.11}
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-gradepush}
      DB_PASSWORD: ${DB_PASSWORD:?Set a unique database password}
      DB_NAME: ${DB_NAME:-gradepush}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      DEMO_MODE: ${DEMO_MODE:-false}
      PHX_HOST: ${PHX_HOST:?Set your public domain}
      PHX_SCHEME: https
      PHX_URL_PORT: 443
      PORT: 4000
      POOL_SIZE: ${POOL_SIZE:-10}
      TRUSTED_PROXY_HOSTS: caddy
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    mem_limit: ${APP_MEMORY_LIMIT:-1g}
    pids_limit: 256
    networks: [frontend, database]
    tmpfs:
      - /tmp:mode=1777,size=64m
    volumes:
      - gradepush_data:/var/lib/gradepush

  db:
    depends_on:
      runtime-config-init:
        condition: service_completed_successfully
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    environment:
      POSTGRES_DB: ${DB_NAME:-gradepush}
      POSTGRES_USER: ${DB_USER:-gradepush}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set a unique database password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    read_only: true
    mem_limit: ${DB_MEMORY_LIMIT:-1g}
    pids_limit: 256
    shm_size: 256m
    tmpfs:
      - /tmp:mode=1777,size=64m
      - /var/run/postgresql:mode=3777,size=16m
    networks: [database]
    volumes:
      - postgres_data:/var/lib/postgresql
      - postgres_init:/docker-entrypoint-initdb.d:ro

  caddy-data-init:
    image: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    user: "0:0"
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    mem_limit: 64m
    pids_limit: 16
    command: ["chown", "-R", "10001:10001", "/data", "/config"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  caddy:
    image: ${GRADEPUSH_PROXY_IMAGE:-ghcr.io/gradepush/gradepush-caddy:0.1.11}
    depends_on:
      app:
        condition: service_healthy
      caddy-data-init:
        condition: service_completed_successfully
      runtime-config-init:
        condition: service_completed_successfully
    environment:
      PHX_HOST: ${PHX_HOST:?Set PHX_HOST to the public domain}
      GOMEMLIMIT: 384MiB
    ports:
      - "80:8080"
      - "443:8443"
      - "443:8443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - caddy_runtime_config:/etc/caddy:ro
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: ${PROXY_MEMORY_LIMIT:-512m}
    pids_limit: 128
    tmpfs:
      - /tmp:mode=1777,size=16m
    networks: [frontend]

networks:
  frontend:
  database:
    internal: true

volumes:
  gradepush_data:
  postgres_data:
  caddy_data:
  caddy_config:
  postgres_init:
  caddy_runtime_config:
